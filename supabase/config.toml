# Generated environment contract. Contains no secret values.
project_id = "shipaudit"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.audit-source-files]
public = false
file_size_limit = 52428800

[storage.buckets.carrier-contracts]
public = false

[storage.buckets.carrier-statements]
public = false
file_size_limit = 20971520
allowed_mime_types = ["application/pdf"]

[storage.buckets.internal-exports]
public = false

[storage.buckets.ivr-audio]
public = true

[storage.buckets.payment-receipts]
public = false
file_size_limit = 10485760
allowed_mime_types = ["image/jpeg", "image/jpg", "image/png", "image/webp", "application/pdf"]

[storage.buckets.support-attachments]
public = false

[storage.buckets.task-files]
public = false

[storage.buckets.webhook-uploads]
public = false

[storage.buckets.weight-billing]
public = false
file_size_limit = 52428800

[storage.buckets.zoho-intake]
public = false

[auth]
enabled = true
site_url = "env(APP_SITE_URL)"
additional_redirect_urls = ["env(APP_ADDITIONAL_REDIRECT_URLS)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

