name: Product quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify changed lines
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                BASE_SHA="$GITHUB_SHA^"
              fi
              ;;
            workflow_dispatch)
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
                BASE_SHA="$GITHUB_SHA^"
              else
                git fetch --no-tags origin "$DEFAULT_BRANCH"
                BASE_SHA="$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")"
              fi
              ;;
            *)
              echo "::error::Unsupported event for changed-lines verification: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          if [[ -z "$BASE_SHA" ]] || ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::Unable to determine a trusted base SHA for changed-lines verification."
            exit 1
          fi

          git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Run full test suite
        run: node --test tests/*.test.mjs

      - name: Build production bundle
        run: npm run build
